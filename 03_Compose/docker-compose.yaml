services:
 web:
  build:
   context: .
   dockerfile: Dockerfile
  ports:
   - "3000:3000"
  environment:
   DB_HOST: db
   DB_USER: appuser
   DB_PASSWORD: apppass
   DB_NAME: appdb
  depends_on:
   - db
  deploy:
   resources:
    limits:
     memory: 512M # maximo de memoria
     cpus: "0.5" # maximo medio nucleo
    reservations:
     memory: 256M # memoria reservada
     cpus: "0.25" # CPU reservada
 db:
  image: mysql:8.0
  container_name: mysql-db
  environment:
   MYSQL_ROOT_PASSWORD: rootpass
   MYSQL_DATABASE: appdb
   MYSQL_USER: appuser
   MYSQL_PASSWORD: apppass
  ports:
   - "3306:3306"
  healthcheck:
   test: ["CMD-SHELL", "mysqladmin ping -h localhost || exit 1"]
   interval: 10s
   timeout: 5s
   retries: 3
